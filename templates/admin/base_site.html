{% extends "admin/base_site.html" %}
{% load static %}

{% block extrahead %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static 'admin_custom/admin.css' %}">
{% endblock %}

{% block branding %}
    <h1 id="site-name"><a href="{% url 'admin:index' %}">مدیریت کتابخانه دیجیتال</a></h1>
{% endblock %}

{% block extrabody %}
    {{ block.super }}
    <button type="button" class="admin-back-btn" id="admin-back-btn">↩ بازگشت</button>
    <script>
        (function () {
            var btn = document.getElementById('admin-back-btn');
            if (!btn) return;
            btn.addEventListener('click', function () {
                if (document.referrer && document.referrer.indexOf(window.location.origin) === 0 && history.length > 1) {
                    history.back();
                } else {
                    window.location.href = '/admin/';
                }
            });
        })();
    </script>
{% endblock %}
